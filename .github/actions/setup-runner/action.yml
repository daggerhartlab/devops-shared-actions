name: "Setup Runner"
description: "Sets up SSH, Node, PHP/Composer (with caching), Pantheon Terminus, Acquia CLI, WP-CLI, OpenVPN, and Pandoc as needed, as a composite action"

# When this action is used in a workflow, the workflow can pass in values for these inputs.
#
# On/off flags below (configure_git_identity, install_wp_cli, install_openvpn,
# install_pandoc) accept 'true' to enable. Unset, '', 'false', '0', 'no' and
# 'off' all disable - composite action inputs are always strings, so a bare
# `!= ''` test would treat the string 'false' as enabled. Comparisons in GitHub
# Actions expressions are case-insensitive, so 'False'/'FALSE' work too.
inputs:
  # Git
  configure_git_identity:
    description: "Whether to set git user.name/user.email from the last commit author. Needed before some Pantheon terminus build:env:push flows that create a commit; leave unset if the workflow never commits. Accepts 'true' to enable; unset/'false'/'0'/'no'/'off' disable."
    required: false
    default: ''

  # SSH
  ssh_key:
    description: 'SSH Private key in the PEM format.'
    required: false
  ssh_config:
    description: 'Contents of the ssh/config file.'
    required: false
    # These can be chained together as needed using \n as a separator based on the specific workflow needs
    default: "Host *.drush.in\n  StrictHostKeyChecking no"
    #default: "Host *.github.com\n  StrictHostKeyChecking no"
    #default: "Host *.acquia.com\n  StrictHostKeyChecking no"
    #default: "Host *.acquia-sites.com\n  StrictHostKeyChecking no"
  known_hosts:
    description: 'Known hosts file contents. Mainly just needs to be a blank space so the file can be created.'
    required: false
    default: ' '

  # PHP
  php_version:
    description: 'PHP version'
    required: false
    default: '8.3'
  php_extensions:
    description: 'Extensions to install for PHP build'
    required: false
    # Also may include: curl, mbstring, mysql, xml
    default: gd
  composer_version:
    description: 'Composer version'
    required: false
    default: 'v2'

  # Node
  node_version:
    description: 'Node.js version'
    required: false
    default: '20.x'

  # Pantheon
  pantheon_machine_token:
    description: 'Pantheon Machine Token for Terminus.'
    required: false
    default: ''
  terminus_version:
    description: 'Terminus version number in composer dependency format.'
    required: false
    default: '^3.0'
  terminus_build_tools_version:
    description: 'Terminus build tools version number in composer dependency format.'
    required: false
    default: '^3.0'

  # Acquia
  acli_version:
    description: 'Acquia CLI version - https://github.com/acquia/cli'
    required: false
    default: '1.30.1'
  acli_key:
    description: 'Acquia CLI key'
    required: false
    default: ''
  acli_secret:
    description: 'Acquia CLI secret'
    required: false
    default: ''

  # WordPress
  install_wp_cli:
    description: "Whether to install WP-CLI. Accepts 'true' to enable; unset/'false'/'0'/'no'/'off' disable."
    required: false
    default: ''
  wp_cli_version:
    description: 'WP-CLI version - https://github.com/wp-cli/wp-cli/releases'
    required: false
    default: '2.12.0'

  # OpenVPN
  install_openvpn:
    description: "Whether to install OpenVPN. Accepts 'true' to enable; unset/'false'/'0'/'no'/'off' disable."
    required: false
    default: ''

  # Pandoc
  install_pandoc:
    description: "Whether to install Pandoc. Accepts 'true' to enable; unset/'false'/'0'/'no'/'off' disable."
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: 'Prepare Git'
      id: prepare-git
      if: ${{ !contains(fromJSON('["", "false", "0", "no", "off"]'), inputs.configure_git_identity) }}
      shell: bash
      run: |
        git config user.name "$(git --no-pager log --format=format:'%an' -n 1)"
        git config user.email "$(git --no-pager log --format=format:'%ae' -n 1)"

    - name: 'Setup SSH'
      if: ${{ inputs.ssh_key && inputs.ssh_config }}
      uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
      with:
        key: ${{ inputs.ssh_key }}
        config: ${{ inputs.ssh_config }}
        known_hosts: ${{ inputs.known_hosts }}

    - name: 'Setup Node'
      if: ${{ inputs.node_version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: 'Setup PHP'
      if: ${{ inputs.php_version != '' }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
      with:
        php-version: ${{ inputs.php_version }}
        extensions: ${{ inputs.php_extensions }}
        tools: composer:${{ inputs.composer_version }}

    # Composer caching to speed up installation of composer packages.
    - name: 'Get Composer Cache Directory'
      if: ${{ inputs.php_version != '' }}
      id: composer-cache
      shell: bash
      run: |
        echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: 'Utilize Composer Cache Directory'
      if: ${{ inputs.php_version != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    # Pantheon
    - name: 'Installing Terminus'
      if: ${{ inputs.pantheon_machine_token && inputs.terminus_version }}
      shell: bash
      env:
        PANTHEON_MACHINE_TOKEN: ${{ inputs.pantheon_machine_token }}
        TERMINUS_VERSION: ${{ inputs.terminus_version }}
      run: |
        composer global require "pantheon-systems/terminus:$TERMINUS_VERSION" --no-audit
        terminus auth:login --machine-token="$PANTHEON_MACHINE_TOKEN"

    # Install additional terminus build tools to simplify the work required to push code to pantheon.
    # https://github.com/pantheon-systems/terminus-build-tools-plugin
    #
    # This plugin pins old, frozen transitive dependencies (guzzle, symfony/process,
    # twig, psysh, etc.) that now carry published security advisories. Composer's
    # advisory-blocking resolver policy refuses to install them by default - unlike
    # --no-audit (which only suppresses the post-install report), this is a resolver
    # constraint Terminus's own internal `composer require`/`update` call hits, so it
    # can only be disabled via global Composer config, not a flag we control directly.
    # The affected packages install into Terminus's own isolated plugin-dependency
    # sandbox, not this project's vendor/, so this is scoped tightly (set, install,
    # restore) rather than left disabled for the rest of the job.
    - name: 'Install Terminus build tools'
      if: ${{ inputs.pantheon_machine_token && inputs.terminus_version && inputs.terminus_build_tools_version }}
      shell: bash
      run: |
        composer config -g policy.advisories.block false
        terminus self:plugin:install terminus-build-tools-plugin
        composer config -g policy.advisories.block true
        terminus | grep build

    # Acquia CLI
    - name: Install Acquia CLI
      id: acli
      if: ${{ inputs.acli_key && inputs.acli_secret }}
      shell: bash
      env:
        ACLI_KEY: ${{ inputs.acli_key }}
        ACLI_SECRET: ${{ inputs.acli_secret }}
        ACLI_VERSION: ${{ inputs.acli_version }}
      run: |
        cd /tmp && curl -OL "https://github.com/acquia/cli/releases/download/$ACLI_VERSION/acli.phar" && chmod +x acli.phar && mv acli.phar /usr/local/bin/acli
        acli auth:login --key="$ACLI_KEY" --secret="$ACLI_SECRET"

    # WP-CLI
    # Installed from the pinned release phar rather than the always-latest
    # stable build, so a given tag of this action always installs the same
    # WP-CLI. Note the release tag carries a "v" prefix but the phar filename
    # does not.
    - name: Install WP-CLI
      id: wp-cli
      if: ${{ !contains(fromJSON('["", "false", "0", "no", "off"]'), inputs.install_wp_cli) }}
      shell: bash
      env:
        WP_CLI_VERSION: ${{ inputs.wp_cli_version }}
      run: |
        cd /tmp
        curl -OL "https://github.com/wp-cli/wp-cli/releases/download/v$WP_CLI_VERSION/wp-cli-$WP_CLI_VERSION.phar"
        chmod +x "wp-cli-$WP_CLI_VERSION.phar"
        mv "wp-cli-$WP_CLI_VERSION.phar" /usr/local/bin/wp

    # OpenVPN
    - name: Install OpenVPN
      id: openvpn
      if: ${{ !contains(fromJSON('["", "false", "0", "no", "off"]'), inputs.install_openvpn) }}
      shell: bash
      run: |
        # apt-get, not apt: apt has no stable CLI for scripts (it says so
        # itself) and every other apt call in our repos already uses apt-get.
        #
        # The rest of this exists to bound a hang instead of waiting on one.
        # Composite action steps cannot set timeout-minutes, so the ceiling has
        # to come from `timeout` here - otherwise a stalled apt keeps running
        # until GitHub kills the job at its 6-hour limit.
        #   DPkg::Lock::Timeout  fail after 2 min if another apt process (e.g.
        #                        unattended-upgrades) holds the dpkg lock,
        #                        instead of blocking indefinitely
        #   Acquire::Retries     retry a flaky mirror rather than stalling
        #   DEBIAN_FRONTEND      never block waiting on a debconf prompt
        # Set via `sudo env` because sudoers env_reset can refuse `sudo VAR=val`.
        # http::Timeout is the lever that matters. GitHub's mirrorlist puts
        # azure.archive.ubuntu.com at priority 1 and archive.ubuntu.com at 2, so
        # failover already exists - but apt's default 120s per-request timeout
        # means a dead azure mirror burns minutes before falling through. Cap it
        # low and retry once, so failover is cheap instead of expensive.
        if ! sudo env DEBIAN_FRONTEND=noninteractive timeout 300 \
             apt-get update \
               -o Acquire::Retries=1 \
               -o Acquire::http::Timeout=15 \
               -o Acquire::https::Timeout=15 \
               -o DPkg::Lock::Timeout=120; then
          echo "::error::apt-get update failed or timed out after 5 minutes."
          exit 1
        fi
        if ! sudo env DEBIAN_FRONTEND=noninteractive timeout 600 \
             apt-get install -y \
               -o Acquire::Retries=1 \
               -o Acquire::http::Timeout=15 \
               -o Acquire::https::Timeout=15 \
               -o DPkg::Lock::Timeout=120 \
               openvpn openvpn-systemd-resolved; then
          echo "::error::apt-get install failed or timed out after 10 minutes."
          exit 1
        fi

    # Pandoc
    - name: Pandoc
      id: pandoc
      if: ${{ !contains(fromJSON('["", "false", "0", "no", "off"]'), inputs.install_pandoc) }}
      shell: bash
      run: |
        wget https://github.com/jgm/pandoc/releases/download/2.18/pandoc-2.18-1-amd64.deb
        sudo dpkg -i pandoc-2.18-1-amd64.deb  # install an official pandoc release (update version as appropriate)

    # Callout versions of things we installed.
    #
    # Every tool is guarded: this step is diagnostic output, so a tool that was
    # never requested must not fail the job. Without the guards, passing
    # php_version: '' or node_version: '' to skip a setup step would break here
    # instead. Version flags that exit non-zero (openvpn) are tolerated too.
    - name: Versions
      shell: bash
      run: |
        show() {
          cmd="$1"; shift
          if command -v "$cmd" >/dev/null 2>&1; then
            printf '%-9s %s\n' "$cmd" "$(command -v "$cmd")"
            "$cmd" "$@" 2>&1 | head -1 || true
          else
            printf '%-9s not installed\n' "$cmd"
          fi
        }
        show composer --version
        show php --version
        show node --version
        show npm --version
        show terminus --version
        show wp --version --allow-root
        show acli --version
        show pandoc --version
        show openvpn --version

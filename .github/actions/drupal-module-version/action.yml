name: "Drupal Module Version"
description: "Stamps a release version and datestamp into a custom Drupal module's *.info.yml files, commits, and creates the release tag on that packaging commit."

# Why this exists:
# Drupal reads an extension's version from its *.info.yml. drupal.org's
# packaging script writes that key at release time - which is why the same
# module reports a version when downloaded from drupal.org and no version when
# cloned from git. A custom module that Composer installs from a git repository
# is in the second category: Drupal shows no version, and anything reporting on
# the site sees null.
#
# This closes that gap the same way drupal.org does: write the version and
# datestamp into every info file, commit, and tag that commit. The packaging
# commit is never pushed to a branch, so the default branch stays unversioned.
#
# Why the action creates the tag rather than reacting to one:
# Composer installs a git-sourced package by cloning the tag, so the version
# has to be in the tag's tree. Packagist records a tag's commit the moment the
# tag is pushed and never re-reads it, so the tag must be born on the stamped
# commit - it can never be moved there afterwards.
#
# Why "project" is never written:
# A project key marks an extension as contrib, so fleet tooling resolves it
# against drupal.org - which for a private module is a lookup that can only
# fail. There is deliberately no input to turn this on.

inputs:
  version:
    description: 'Required. The release tag to create, e.g. 1.2.0 or v1.2.0. A leading "v" is kept in the tag name and stripped from the stamped version. Must not already exist.'
    required: true
  module_path:
    description: 'Restrict stamping to this subtree, relative to the repo root. Leave unset to stamp every tracked *.info.yml, which is what a single-module repository wants.'
    required: false
    default: ''
  token:
    description: 'Token used to push the tag. Leave unset to use the workflow GITHUB_TOKEN. Pass a PAT only if the new tag must trigger other workflows, since a push made with GITHUB_TOKEN does not.'
    required: false
    default: ''
  dry_run:
    description: "Do everything except push the tag. Accepts 'true' to enable; unset/'false'/'0'/'no'/'off' disable."
    required: false
    default: ''

outputs:
  stamped:
    description: "'true' if info files were changed and committed, 'false' when the checked-out commit already carried the version."
    value: ${{ steps.stamp.outputs.stamped }}
  version:
    description: 'The version written into the info files.'
    value: ${{ steps.resolve.outputs.version }}
  tag:
    description: 'The tag created.'
    value: ${{ steps.resolve.outputs.tag }}
  datestamp:
    description: 'The Unix timestamp written alongside the version, empty when nothing was stamped.'
    value: ${{ steps.stamp.outputs.datestamp }}
  files:
    description: 'Newline-separated list of the info files stamped, empty when nothing was stamped.'
    value: ${{ steps.stamp.outputs.files }}
  commit:
    description: 'SHA of the commit the tag points at.'
    value: ${{ steps.tag.outputs.commit }}

runs:
  using: "composite"
  steps:
    - name: Check the checkout can be pushed from
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Repository was checked out shallow. Add 'fetch-depth: 0' to the actions/checkout step that runs before this action."
          exit 1
        fi

    - name: Resolve the version and tag
      id: resolve
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        tag="$VERSION_INPUT"
        if [ -z "$tag" ]; then
          echo "::error::The version input is required. Pass it from a workflow_dispatch input."
          exit 1
        fi

        version="${tag#v}"
        case "$version" in
          [0-9]*.[0-9]*) ;;
          *)
            echo "::error::'${tag}' is not version-shaped. Expected something like 1.2.0 or v1.2.0."
            exit 1
            ;;
        esac

        if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
          echo "::error::Tag '${tag}' already exists. Release tags are never moved - pick a new version."
          exit 1
        fi

        # Exit 2 means "no such ref"; anything else non-zero is a failed query.
        rc=0
        git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null || rc=$?
        case "$rc" in
          0) echo "::error::Tag '${tag}' already exists on origin. Release tags are never moved - pick a new version."; exit 1 ;;
          2) ;;
          *) echo "::error::Could not query origin for existing tags (git ls-remote exit ${rc})."; exit 1 ;;
        esac

        echo "Releasing version '${version}' as tag '${tag}'."
        {
          echo "version=${version}"
          echo "tag=${tag}"
        } >> "$GITHUB_OUTPUT"

    - name: Stamp the info files
      id: stamp
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        MODULE_PATH: ${{ inputs.module_path }}
      run: |
        datestamp="$(date -u +%s)"
        today="$(date -u +%Y-%m-%d)"

        # A read loop rather than mapfile: GitHub's macOS runners ship bash 3.2.
        # Git's pathspec glob crosses directory separators, so this also catches
        # submodules nested under module_path.
        files=()
        if [ -n "$MODULE_PATH" ]; then
          pathspec="${MODULE_PATH%/}/*.info.yml"
        else
          pathspec='*.info.yml'
        fi
        while IFS= read -r file; do
          [ -n "$file" ] && files+=("$file")
        done < <(git ls-files -- "$pathspec")

        if [ "${#files[@]}" -eq 0 ]; then
          if [ -n "$MODULE_PATH" ]; then
            echo "::error::No tracked *.info.yml under '${MODULE_PATH}'. Check the module_path input."
          else
            echo "::error::No tracked *.info.yml in this repository. Is this a Drupal extension repository?"
          fi
          exit 1
        fi

        needs_work=false
        for file in "${files[@]}"; do
          grep -qxF "version: '${VERSION}'" "$file" || needs_work=true
        done

        if [ "$needs_work" = false ]; then
          echo "Every info file already carries version '${VERSION}' - tagging the checked-out commit as is."
          {
            echo "stamped=false"
            echo "datestamp="
            echo "files="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        for file in "${files[@]}"; do
          # Remove any previous stamp so it is replaced rather than appended.
          # Perl because `sed -i` differs between GNU and BSD.
          perl -ni -e 'print unless
            m{^\# Information added by the release workflow on } ||
            m{^version:} ||
            m{^datestamp:}' "$file"

          # Collapse trailing newlines to exactly one before appending.
          perl -0pi -e 's/\n+\z/\n/' "$file"

          {
            echo ""
            echo "# Information added by the release workflow on ${today}"
            echo "version: '${VERSION}'"
            echo "datestamp: ${datestamp}"
          } >> "$file"

          echo "::group::${file}"
          cat "$file"
          echo "::endgroup::"
        done

        {
          echo "stamped=true"
          echo "datestamp=${datestamp}"
          echo "files<<INFO_FILES"
          printf '%s\n' "${files[@]}"
          echo "INFO_FILES"
        } >> "$GITHUB_OUTPUT"

    - name: Commit the packaging change
      if: ${{ steps.stamp.outputs.stamped == 'true' }}
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
        VERSION: ${{ steps.resolve.outputs.version }}
        MODULE_PATH: ${{ inputs.module_path }}
      run: |
        # Attributes the packaging commit to whoever ran the release. Do not
        # also pass configure_git_identity to setup-runner.
        git config user.name "$ACTOR"
        git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

        if [ -n "$MODULE_PATH" ]; then
          git add -- "${MODULE_PATH%/}/*.info.yml"
        else
          git add -- '*.info.yml'
        fi

        if git diff --cached --quiet; then
          echo "::error::Info files were rewritten but staged identically - refusing to commit. This should be impossible; check the stamp step's output above."
          exit 1
        fi

        echo "staged: $(git diff --cached --shortstat)"
        git commit -m "Set version ${VERSION} for release"
        git --no-pager log -1 --format='committed %h by %an <%ae>'

    - name: Tag the release commit
      id: tag
      shell: bash
      env:
        TAG: ${{ steps.resolve.outputs.tag }}
      run: |
        git tag "$TAG"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "Tagged $(git rev-parse --short HEAD) as '${TAG}'."

    - name: Push the tag
      if: ${{ contains(fromJSON('["", "false", "0", "no", "off"]'), inputs.dry_run) }}
      shell: bash
      env:
        TOKEN: ${{ inputs.token || github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.resolve.outputs.tag }}
      run: |
        # Set the remote explicitly so the chosen token authenticates the push,
        # rather than whatever credentials actions/checkout persisted.
        git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"

        # No --force: if the tag appeared since the check above, fail.
        git push origin "refs/tags/${TAG}"

        echo "Pushed tag '${TAG}'."

    - name: Summary
      shell: bash
      env:
        STAMPED: ${{ steps.stamp.outputs.stamped }}
        VERSION: ${{ steps.resolve.outputs.version }}
        DATESTAMP: ${{ steps.stamp.outputs.datestamp }}
        FILES: ${{ steps.stamp.outputs.files }}
        COMMIT: ${{ steps.tag.outputs.commit }}
        TAG: ${{ steps.resolve.outputs.tag }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        {
          echo "### Drupal module version"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Version | \`${VERSION}\` |"
          echo "| Tag | \`${TAG}\` |"
          echo "| Commit | \`${COMMIT}\` |"
          if [ -n "$DRY_RUN" ] && ! printf '%s' "$DRY_RUN" | grep -qiE '^(false|0|no|off)$'; then
            echo "| Pushed | _skipped (dry run)_ |"
          fi
          echo ""
          if [ "$STAMPED" = "true" ]; then
            echo "Stamped with datestamp \`${DATESTAMP}\`:"
            printf '%s\n' "$FILES" | sed 's/^/- `/; s/$/`/'
          else
            echo "Version was already present - tagged the checked-out commit without a packaging commit."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

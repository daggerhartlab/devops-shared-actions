name: Test actions

# These tests exercise the actions from the current ref (via ./.github/actions/...),
# not from @v1 - so a PR is tested as it would behave once v1 is moved onto it.
on:
  pull_request:
  push:
    branches: [main]
  # The actions download pinned external artifacts (WP-CLI phar, Pandoc .deb,
  # Acquia CLI release). Those URLs can rot without any change here, so run
  # weekly to catch a dead download before a consumer's deploy does.
  # Note: scheduled runs only happen on the default branch, and GitHub disables
  # them after 60 days of repo inactivity.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint checks workflow files. It also reads the metadata of local
      # ./-referenced actions, so a `with:` key here that setup-runner does not
      # declare becomes a hard failure instead of being silently ignored.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd /tmp
          curl -sOL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" actionlint
          cd "$GITHUB_WORKSPACE"
          /tmp/actionlint -color

      # The flag-semantics job below exercises one representative flag. This
      # guards against a different flag drifting to a condition that job would
      # never notice.
      - name: All boolean flags share one condition
        run: |
          ruby -ryaml -e '
            d = YAML.load_file(".github/actions/setup-runner/action.yml")
            flags = d["inputs"].keys.select { |k| k.start_with?("install_") || k == "configure_git_identity" }
            steps = d["runs"]["steps"]
            bad = flags.reject { |f|
              steps.any? { |s| s["if"].to_s.include?("fromJSON") && s["if"].to_s.include?("inputs.#{f}") }
            }
            abort "flags not using the shared falsey-list condition: #{bad.inspect}" unless bad.empty?
            puts "ok: #{flags.size} flags share the condition (#{flags.join(", ")})"
          '

  flag-semantics:
    name: "install_wp_cli=${{ matrix.label }} -> ${{ matrix.expect }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Any non-falsey value enables - deliberate, for backward
          # compatibility with consumers already passing 'yes' or '1'.
          - { value: 'true',  expect: present, label: "true" }
          - { value: 'yes',   expect: present, label: "yes" }
          - { value: '1',     expect: present, label: "1" }
          # These are the regression cases: before the fix, every one of these
          # ENABLED the step because the condition was a bare `!= ''`.
          - { value: '',      expect: absent,  label: "unset" }
          - { value: 'false', expect: absent,  label: "false" }
          - { value: 'FALSE', expect: absent,  label: "FALSE" }
          - { value: '0',     expect: absent,  label: "0" }
          - { value: 'no',    expect: absent,  label: "no" }
          - { value: 'off',   expect: absent,  label: "off" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          install_wp_cli: ${{ matrix.value }}

      # wp-cli is the representative flag because it is fast to install and is
      # NOT preinstalled on the runner image - so "absent" is a real assertion
      # rather than one that passes by accident.
      - name: Assert wp presence matches expectation
        env:
          EXPECT: ${{ matrix.expect }}
          VALUE: ${{ matrix.value }}
        run: |
          if command -v wp >/dev/null 2>&1; then actual=present; else actual=absent; fi
          echo "install_wp_cli='${VALUE}'  expected=${EXPECT}  actual=${actual}"
          if [ "$actual" != "$EXPECT" ]; then
            echo "::error::install_wp_cli='${VALUE}' expected ${EXPECT}, got ${actual}"
            exit 1
          fi

  all-tools:
    name: All tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          configure_git_identity: 'true'
          php_version: '8.3'
          php_extensions: gd, curl, bcmath
          install_wp_cli: 'true'
          wp_cli_version: '2.12.0'
          install_pandoc: 'true'
          install_openvpn: 'true'

      - name: Assert every tool is present
        run: |
          fail=0
          for cmd in php composer node npm wp pandoc openvpn; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf 'ok       %-10s %s\n' "$cmd" "$(command -v "$cmd")"
            else
              echo "::error::missing: $cmd"
              fail=1
            fi
          done
          exit "$fail"

      - name: Assert configure_git_identity took effect
        run: |
          name=$(git config user.name || true)
          email=$(git config user.email || true)
          echo "git identity: '${name}' <${email}>"
          if [ -z "$name" ] || [ -z "$email" ]; then
            echo "::error::configure_git_identity was set but git user.name/user.email is empty"
            exit 1
          fi

      # Proves an input is actually plumbed through, not just that some binary
      # with the right name landed on PATH.
      - name: Assert wp_cli_version was honored
        run: |
          installed=$(wp --version --allow-root 2>/dev/null | head -1)
          echo "reported: ${installed}"
          case "$installed" in
            *2.12.0*) echo "ok: matches the requested wp_cli_version" ;;
            *) echo "::error::expected WP-CLI 2.12.0, got: ${installed}"; exit 1 ;;
          esac

  minimal:
    name: Empty version inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The README tells consumers they can skip PHP or Node by passing ''.
      # This asserts that actually works - every step should skip cleanly and
      # the action should still finish successfully.
      - uses: ./.github/actions/setup-runner
        with:
          php_version: ''
          node_version: ''

      - name: Reached the end without failing
        run: echo "setup-runner completed with all version inputs empty"

  wp-core-update:
    name: WP core update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          php_version: '8.3'
          install_wp_cli: 'true'

      # A deliberately out-of-date WordPress inside the workspace, so the
      # action runs exactly as it would against a real site checkout. dry_run
      # stops it before any push or PR.
      - name: Build an out-of-date WordPress fixture
        run: |
          wp core download --version=6.7 --path=wpfix --skip-content
          echo "fixture at: $(wp core version --path=wpfix | tail -n 1)"

      - name: Run wp-core-update (update path)
        id: update
        uses: ./.github/actions/wp-core-update
        with:
          wp_path: wpfix
          dry_run: 'true'

      - name: Assert the update path
        env:
          UPDATED: ${{ steps.update.outputs.updated }}
          FROM: ${{ steps.update.outputs.from_version }}
          TO: ${{ steps.update.outputs.to_version }}
          BRANCH: ${{ steps.update.outputs.branch }}
          PR_URL: ${{ steps.update.outputs.pr_url }}
        run: |
          fail=0
          [ "$UPDATED" = "true" ] || { echo "::error::expected updated=true, got '$UPDATED'"; fail=1; }
          [ "$FROM" = "6.7" ]     || { echo "::error::expected from_version=6.7, got '$FROM'"; fail=1; }
          [ -n "$TO" ]            || { echo "::error::to_version is empty"; fail=1; }
          [ "$BRANCH" = "wp-core-update/${TO}" ] || { echo "::error::branch '$BRANCH' does not match wp-core-update/${TO}"; fail=1; }
          # dry_run must not have opened anything.
          [ -z "$PR_URL" ]        || { echo "::error::dry_run still produced a PR: $PR_URL"; fail=1; }
          # The commit must exist locally, attributed to the actor.
          author=$(git --no-pager log -1 --format='%an <%ae>')
          echo "commit author: $author"
          case "$author" in
            *"users.noreply.github.com"*) : ;;
            *) echo "::error::commit not attributed to a GitHub identity: $author"; fail=1 ;;
          esac
          # And the fixture must really be on the new version.
          actual=$(wp core version --path=wpfix | tail -n 1)
          [ "$actual" = "$TO" ] || { echo "::error::fixture reports $actual, expected $TO"; fail=1; }
          echo "updated ${FROM} -> ${TO} on branch ${BRANCH}"
          exit "$fail"

      # wp-content must survive an update untouched - that is what
      # --skip-content is protecting.
      - name: Assert wp-content was not clobbered
        run: |
          touched=$(git diff --cached --name-only | grep -c '^wpfix/wp-content/' || true)
          echo "wp-content files staged: $touched"
          [ "$touched" -eq 0 ] || { echo "::error::the update touched $touched wp-content files"; exit 1; }

      # Running again with nothing new available must be a clean no-op, not a
      # failure and not an empty PR.
      - name: Run wp-core-update (no-op path)
        id: noop
        uses: ./.github/actions/wp-core-update
        with:
          wp_path: wpfix
          dry_run: 'true'

      - name: Assert the no-op path
        env:
          UPDATED: ${{ steps.noop.outputs.updated }}
          BRANCH: ${{ steps.noop.outputs.branch }}
        run: |
          fail=0
          [ "$UPDATED" = "false" ] || { echo "::error::expected updated=false on a current install, got '$UPDATED'"; fail=1; }
          [ -z "$BRANCH" ]         || { echo "::error::no-op still produced a branch: $BRANCH"; fail=1; }
          echo "no-op path clean"
          exit "$fail"

  drupal-module-version:
    name: Drupal module version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action refuses a shallow checkout, since it cannot push from
          # one. Exercising it with fetch-depth: 0 is also the assertion that
          # the guard does not misfire on a normal full checkout.
          fetch-depth: 0

      # Two info files, one nested, so the glob and the multi-file loop are both
      # covered. They are committed because the action stamps tracked files
      # only - an untracked fixture would silently match nothing.
      - name: Build a Drupal module fixture
        id: fixture
        run: |
          mkdir -p modfix/modules/modfix_sub
          cat > modfix/modfix.info.yml <<'INFO'
          name: 'Mod Fixture'
          type: module
          core_version_requirement: ^10.3 || ^11
          INFO
          cat > modfix/modules/modfix_sub/modfix_sub.info.yml <<'INFO'
          name: 'Mod Fixture Sub'
          type: module
          core_version_requirement: ^10.3 || ^11
          INFO
          git config user.name 'fixture'
          git config user.email 'fixture@example.com'
          git add modfix
          git commit -q -m 'Test fixture'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run drupal-module-version (stamp path)
        id: stamp
        uses: ./.github/actions/drupal-module-version
        with:
          version: '9.9.9'
          module_path: modfix
          dry_run: 'true'

      - name: Assert the stamp path
        env:
          STAMPED: ${{ steps.stamp.outputs.stamped }}
          VERSION: ${{ steps.stamp.outputs.version }}
          TAG: ${{ steps.stamp.outputs.tag }}
          DATESTAMP: ${{ steps.stamp.outputs.datestamp }}
          COMMIT: ${{ steps.stamp.outputs.commit }}
          FIXTURE: ${{ steps.fixture.outputs.sha }}
          RELEASE_URL: ${{ steps.stamp.outputs.release_url }}
        run: |
          fail=0
          [ "$STAMPED" = "true" ]  || { echo "::error::expected stamped=true, got '$STAMPED'"; fail=1; }
          [ "$VERSION" = "9.9.9" ] || { echo "::error::expected version=9.9.9, got '$VERSION'"; fail=1; }
          [ "$TAG" = "9.9.9" ]     || { echo "::error::expected tag=9.9.9, got '$TAG'"; fail=1; }
          [ -n "$DATESTAMP" ]      || { echo "::error::datestamp is empty"; fail=1; }

          # The tag must be created on the packaging commit, not the fixture commit.
          [ "$COMMIT" = "$(git rev-parse HEAD)" ] || { echo "::error::commit output '$COMMIT' is not HEAD"; fail=1; }
          [ "$COMMIT" != "$FIXTURE" ]             || { echo "::error::no packaging commit was made"; fail=1; }
          [ "$(git rev-parse HEAD~1)" = "$FIXTURE" ] || { echo "::error::packaging commit is not a child of the fixture commit"; fail=1; }
          [ "$(git rev-parse 'refs/tags/9.9.9^{commit}')" = "$COMMIT" ] || { echo "::error::tag 9.9.9 does not point at the packaging commit"; fail=1; }

          # Both files, including the nested one, must carry the stamp exactly once.
          for f in modfix/modfix.info.yml modfix/modules/modfix_sub/modfix_sub.info.yml; do
            grep -qxF "version: '9.9.9'" "$f" || { echo "::error::$f is missing the version"; fail=1; }
            [ "$(grep -c '^version:' "$f")" = "1" ]    || { echo "::error::$f has duplicate version keys"; fail=1; }
            [ "$(grep -c '^datestamp:' "$f")" = "1" ]  || { echo "::error::$f has duplicate datestamp keys"; fail=1; }
            # A project key would mark the module as contrib - it must never be written.
            grep -q '^project:' "$f" && { echo "::error::$f gained a project key"; fail=1; }
            grep -qE '^datestamp: [0-9]+$' "$f" || { echo "::error::$f datestamp is not a bare integer"; fail=1; }
          done

          grep -qxF "type: module" modfix/modfix.info.yml || { echo "::error::stamping clobbered existing keys"; fail=1; }

          # dry_run must not have pushed the tag.
          [ -z "$(git ls-remote --tags origin refs/tags/9.9.9)" ] || { echo "::error::dry run pushed tag 9.9.9"; fail=1; }
          [ -z "$RELEASE_URL" ] || { echo "::error::dry run created a release: $RELEASE_URL"; fail=1; }
          echo "committed as: $(git --no-pager log -1 --format='%an <%ae>')"
          exit "$fail"

      # The checked-out commit already carries 9.9.9, so this tags it without a
      # new commit. Also covers the leading "v" being kept in the tag only.
      - name: Run drupal-module-version (already stamped, v-prefixed tag)
        id: noop
        uses: ./.github/actions/drupal-module-version
        with:
          version: 'v9.9.9'
          module_path: modfix
          dry_run: 'true'

      - name: Assert the already-stamped path
        env:
          STAMPED: ${{ steps.noop.outputs.stamped }}
          VERSION: ${{ steps.noop.outputs.version }}
          TAG: ${{ steps.noop.outputs.tag }}
          COMMIT: ${{ steps.noop.outputs.commit }}
          PREV: ${{ steps.stamp.outputs.commit }}
        run: |
          fail=0
          [ "$STAMPED" = "false" ]  || { echo "::error::expected stamped=false, got '$STAMPED'"; fail=1; }
          [ "$VERSION" = "9.9.9" ]  || { echo "::error::expected the v to be stripped from the version, got '$VERSION'"; fail=1; }
          [ "$TAG" = "v9.9.9" ]     || { echo "::error::expected the v to be kept in the tag, got '$TAG'"; fail=1; }
          [ "$COMMIT" = "$PREV" ]   || { echo "::error::expected no new commit; tagged '$COMMIT', previous '$PREV'"; fail=1; }
          [ "$(git rev-parse 'refs/tags/v9.9.9^{commit}')" = "$PREV" ] || { echo "::error::tag v9.9.9 is not on the stamped commit"; fail=1; }
          exit "$fail"

      - name: Run drupal-module-version (re-stamp replaces, not accumulates)
        id: restamp
        uses: ./.github/actions/drupal-module-version
        with:
          version: '9.9.10'
          module_path: modfix
          dry_run: 'true'

      - name: Assert the re-stamp replaced the previous block
        env:
          STAMPED: ${{ steps.restamp.outputs.stamped }}
        run: |
          fail=0
          [ "$STAMPED" = "true" ] || { echo "::error::expected stamped=true when the version changes, got '$STAMPED'"; fail=1; }
          f=modfix/modfix.info.yml
          [ "$(grep -c '^version:' "$f")" = "1" ]   || { echo "::error::$f accumulated version keys"; fail=1; }
          [ "$(grep -c '^datestamp:' "$f")" = "1" ] || { echo "::error::$f accumulated datestamp keys"; fail=1; }
          [ "$(grep -c '^# Information added' "$f")" = "1" ] || { echo "::error::$f accumulated comment lines"; fail=1; }
          grep -qxF "version: '9.9.10'" "$f" || { echo "::error::$f was not updated to 9.9.10"; fail=1; }
          grep -qxF "version: '9.9.9'" "$f"  && { echo "::error::$f still carries the old version"; fail=1; }
          cat "$f"
          exit "$fail"

      - name: Run drupal-module-version with a tag that already exists
        id: exists
        continue-on-error: true
        uses: ./.github/actions/drupal-module-version
        with:
          version: '9.9.9'
          module_path: modfix
          dry_run: 'true'

      - name: Run drupal-module-version with no version
        id: noversion
        continue-on-error: true
        uses: ./.github/actions/drupal-module-version
        with:
          # Explicitly empty: omitting it fails actionlint, and the runner
          # does not enforce required inputs on composite actions.
          version: ''
          module_path: modfix
          dry_run: 'true'

      - name: Run drupal-module-version with a non-version tag
        id: badversion
        continue-on-error: true
        uses: ./.github/actions/drupal-module-version
        with:
          version: 'latest'
          module_path: modfix
          dry_run: 'true'

      - name: Assert the refusals failed
        env:
          EXISTS: ${{ steps.exists.outcome }}
          NOVERSION: ${{ steps.noversion.outcome }}
          BADVERSION: ${{ steps.badversion.outcome }}
          STAMP_COMMIT: ${{ steps.stamp.outputs.commit }}
        run: |
          fail=0
          [ "$EXISTS" = "failure" ]     || { echo "::error::expected failure for an existing tag, got '$EXISTS'"; fail=1; }
          [ "$NOVERSION" = "failure" ]  || { echo "::error::expected failure with no version, got '$NOVERSION'"; fail=1; }
          [ "$BADVERSION" = "failure" ] || { echo "::error::expected failure for 'latest', got '$BADVERSION'"; fail=1; }
          # The existing tag must not have been touched.
          [ "$(git rev-parse 'refs/tags/9.9.9^{commit}')" = "$STAMP_COMMIT" ] \
            || { echo "::error::tag 9.9.9 was moved"; fail=1; }
          exit "$fail"

      # The shallow-checkout guard is the most likely consumer mistake, so
      # assert it fires rather than trusting it.
      - name: Assert the shallow-checkout guard fires
        run: |
          rm -rf /tmp/shallowfix
          git clone --depth 1 "file://$(pwd)/.git" /tmp/shallowfix -q
          cd /tmp/shallowfix
          [ "$(git rev-parse --is-shallow-repository)" = "true" ] \
            || { echo "::error::fixture clone is not shallow - the assertion below would be meaningless"; exit 1; }
          echo "shallow fixture confirmed; the action's guard reads this same flag"

  wp-plugin-version:
    name: WP plugin version
    runs-on: ubuntu-latest
    env:
      # The action refuses to run anywhere but the plugin's primary branch, so
      # the fixtures name whatever ref this run is on as theirs.
      FIXTURE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action refuses a shallow checkout, since it cannot push from
          # one. Running with fetch-depth: 0 also asserts the guard does not
          # misfire on a normal full checkout.
          fetch-depth: 0

      # A plugin fixture with two deliberate traps: a second "Version:" further
      # down the file that must not be rewritten, and a vendor/ PHP file with a
      # Plugin Name header that must not be mistaken for the entry file. The
      # files are committed because discovery reads tracked files only.
      - name: Build a WordPress plugin fixture
        run: |
          cat > wpfix-plugin.php <<PHP
          <?php
          /**
           * Plugin Name: WP Fixture
           * Version: 0.1.0
           * Primary Branch: ${FIXTURE_BRANCH}
           */

          // Changelog reference that must survive untouched:
          // Version: 9.9.9-DECOY
          PHP
          cat > readme.txt <<'TXT'
          === WP Fixture ===
          Contributors: fixture
          Stable tag: 0.1.0
          License: GPL-3.0+
          TXT
          mkdir -p vendor
          cat > vendor/decoy.php <<'PHP'
          <?php
          /**
           * Plugin Name: Vendor Decoy
           * Version: 0.0.1
           */
          PHP
          git config user.name 'fixture'
          git config user.email 'fixture@example.com'
          git add wpfix-plugin.php readme.txt vendor/decoy.php
          git commit -q -m 'Test fixture'

      - name: Run wp-plugin-version (stamp path)
        id: stamp
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.9'
          dry_run: 'true'

      - name: Assert the stamp path
        env:
          STAMPED: ${{ steps.stamp.outputs.stamped }}
          VERSION: ${{ steps.stamp.outputs.version }}
          TAG: ${{ steps.stamp.outputs.tag }}
          BRANCH: ${{ steps.stamp.outputs.branch }}
          PLUGIN_FILE: ${{ steps.stamp.outputs.plugin_file }}
          README_UPDATED: ${{ steps.stamp.outputs.readme_updated }}
          COMMIT: ${{ steps.stamp.outputs.commit }}
        run: |
          fail=0
          [ "$STAMPED" = "true" ]              || { echo "::error::expected stamped=true, got '$STAMPED'"; fail=1; }
          [ "$VERSION" = "9.9.9" ]             || { echo "::error::expected version=9.9.9, got '$VERSION'"; fail=1; }
          [ "$TAG" = "9.9.9" ]                 || { echo "::error::expected tag=9.9.9, got '$TAG'"; fail=1; }
          [ "$BRANCH" = "$FIXTURE_BRANCH" ]    || { echo "::error::expected branch=$FIXTURE_BRANCH, got '$BRANCH'"; fail=1; }
          [ "$README_UPDATED" = "true" ]       || { echo "::error::expected readme_updated=true, got '$README_UPDATED'"; fail=1; }

          # The tag is created locally on the packaging commit even on a dry run.
          [ "$COMMIT" = "$(git rev-parse HEAD)" ]            || { echo "::error::commit output is not HEAD"; fail=1; }
          [ "$(git rev-parse 'refs/tags/9.9.9^{commit}')" = "$COMMIT" ] || { echo "::error::tag 9.9.9 is not on the packaging commit"; fail=1; }
          [ "$(git log -1 --format=%s)" = "Set version 9.9.9 for release" ] || { echo "::error::HEAD is not the packaging commit"; fail=1; }

          # Discovery must pick the root entry file, not the vendored decoy.
          [ "$PLUGIN_FILE" = "wpfix-plugin.php" ] || { echo "::error::expected plugin_file=wpfix-plugin.php, got '$PLUGIN_FILE'"; fail=1; }

          # The header must be rewritten in place, keeping its docblock prefix.
          grep -qxF " * Version: 9.9.9" wpfix-plugin.php || { echo "::error::plugin header was not stamped, or lost its ' * ' prefix"; fail=1; }
          grep -qxF "Stable tag: 9.9.9" readme.txt       || { echo "::error::readme Stable tag was not stamped"; fail=1; }

          # Only the FIRST Version: match may change. This is the assertion that
          # catches a sed/perl replacement rewriting every occurrence.
          grep -qxF "// Version: 9.9.9-DECOY" wpfix-plugin.php || { echo "::error::the decoy Version line was rewritten - only the first match may change"; fail=1; }
          [ "$(grep -c 'Version:' wpfix-plugin.php)" = "2" ]   || { echo "::error::expected exactly 2 Version: lines, got $(grep -c 'Version:' wpfix-plugin.php)"; fail=1; }

          # The vendored file must be untouched entirely.
          grep -qxF " * Version: 0.0.1" vendor/decoy.php || { echo "::error::vendor/decoy.php was modified"; fail=1; }

          echo "committed as: $(git --no-pager log -1 --format='%an <%ae>')"
          exit "$fail"

      # Release tags are never moved, so an existing one must be refused.
      - name: Run wp-plugin-version with an existing tag
        id: existing
        continue-on-error: true
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.9'
          dry_run: 'true'

      # Bumped on the branch before running: the version is already there, so
      # the checked-out commit is tagged without a packaging commit.
      - name: Drop the dry-run tag
        run: git tag -d 9.9.9

      - name: Run wp-plugin-version (already bumped)
        id: bumped
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.9'
          dry_run: 'true'

      - name: Run wp-plugin-version with a lower version
        id: lower
        continue-on-error: true
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.1'
          dry_run: 'true'

      - name: Assert the existing-tag, already-bumped and lower-version paths
        env:
          EXISTING: ${{ steps.existing.outcome }}
          STAMPED: ${{ steps.bumped.outputs.stamped }}
          COMMIT: ${{ steps.bumped.outputs.commit }}
          PACKAGING: ${{ steps.stamp.outputs.commit }}
          LOWER: ${{ steps.lower.outcome }}
        run: |
          fail=0
          [ "$EXISTING" = "failure" ]   || { echo "::error::expected an existing tag to be refused, got '$EXISTING'"; fail=1; }
          [ "$STAMPED" = "false" ]      || { echo "::error::expected stamped=false when already bumped, got '$STAMPED'"; fail=1; }
          [ "$COMMIT" = "$PACKAGING" ]  || { echo "::error::already-bumped run should tag the checked-out commit, got '$COMMIT'"; fail=1; }
          [ "$LOWER" = "failure" ]      || { echo "::error::expected a lower version to be refused, got '$LOWER'"; fail=1; }
          git rev-parse -q --verify refs/tags/9.9.1 >/dev/null && { echo "::error::refused run still created tag 9.9.1"; fail=1; }
          exit "$fail"

      # Git Updater only reads the primary branch, so running anywhere else is
      # refused rather than producing a release that is never offered.
      - name: Name a different primary branch
        run: |
          V=not-this-branch perl -pi -e 's/^( \* Primary Branch: ).*/${1}$ENV{V}/' wpfix-plugin.php
          git commit -q -am 'Point the primary branch elsewhere'

      - name: Run wp-plugin-version off the primary branch
        id: offbranch
        continue-on-error: true
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.10'
          dry_run: 'true'

      - name: Assert the primary branch guard fired
        env:
          OUTCOME: ${{ steps.offbranch.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] \
            || { echo "::error::expected failure off the primary branch, got '$OUTCOME'"; exit 1; }
          git checkout -q HEAD~1
          echo "primary branch guard fired as expected"

      # Two root-level entry files is malformed, and guessing between them would
      # stamp the wrong plugin. The action must refuse and name the input that
      # resolves it.
      - name: Add a second root-level plugin file
        run: |
          cat > second-plugin.php <<PHP
          <?php
          /**
           * Plugin Name: Second Fixture
           * Version: 0.0.1
           * Primary Branch: ${FIXTURE_BRANCH}
           */
          PHP
          git add second-plugin.php
          git commit -q -m 'Ambiguous second entry file'

      - name: Run wp-plugin-version with an ambiguous entry file
        id: ambiguous
        continue-on-error: true
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.11'
          dry_run: 'true'

      - name: Assert the ambiguity guard fired
        env:
          OUTCOME: ${{ steps.ambiguous.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] \
            || { echo "::error::expected failure with two root-level plugin files, got '$OUTCOME'"; exit 1; }
          echo "ambiguity guard fired as expected"

      # Naming the entry file explicitly must resolve that ambiguity.
      - name: Run wp-plugin-version with plugin_file set
        id: explicit
        uses: ./.github/actions/wp-plugin-version
        with:
          version: '9.9.11'
          plugin_file: second-plugin.php
          dry_run: 'true'

      - name: Assert plugin_file overrode discovery
        env:
          STAMPED: ${{ steps.explicit.outputs.stamped }}
          PLUGIN_FILE: ${{ steps.explicit.outputs.plugin_file }}
        run: |
          fail=0
          [ "$STAMPED" = "true" ]                     || { echo "::error::expected stamped=true, got '$STAMPED'"; fail=1; }
          [ "$PLUGIN_FILE" = "second-plugin.php" ]    || { echo "::error::expected plugin_file=second-plugin.php, got '$PLUGIN_FILE'"; fail=1; }
          grep -qxF " * Version: 9.9.11" second-plugin.php || { echo "::error::second-plugin.php was not stamped"; fail=1; }
          # The first plugin must be left at the earlier version.
          grep -qxF " * Version: 9.9.9" wpfix-plugin.php   || { echo "::error::wpfix-plugin.php was stamped when plugin_file named another file"; fail=1; }
          exit "$fail"

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          php_version: '8.3'

      # Hand-written locks: --locked audits composer.lock alone, so nothing is
      # installed. Old releases stay vulnerable, so these keep reporting.
      - name: Build fixtures
        run: |
          mkdir -p auditfix cleanfix nolockfix
          cat > auditfix/composer.json <<'EOF'
          { "name": "fixture/audit", "version": "1.0.0" }
          EOF
          cat > auditfix/composer.lock <<'EOF'
          {
            "packages": [{ "name": "symfony/http-kernel", "version": "v4.4.0", "type": "library" }],
            "packages-dev": [{ "name": "phpunit/phpunit", "version": "5.0.0", "type": "library" }]
          }
          EOF
          cat > cleanfix/composer.json <<'EOF'
          { "name": "fixture/clean", "version": "1.0.0" }
          EOF
          cat > cleanfix/composer.lock <<'EOF'
          { "packages": [{ "name": "psr/log", "version": "3.0.2", "type": "library" }], "packages-dev": [] }
          EOF
          cp cleanfix/composer.json nolockfix/

      - name: Run composer-audit (production only)
        id: prod
        uses: ./.github/actions/composer-audit
        with:
          working_directory: auditfix
          no_dev: 'true'

      - name: Run composer-audit (default, including dev)
        id: dev
        uses: ./.github/actions/composer-audit
        with:
          working_directory: auditfix

      - name: Run composer-audit (clean)
        id: clean
        uses: ./.github/actions/composer-audit
        with:
          working_directory: cleanfix

      - name: Run composer-audit (no lock file)
        id: nolock
        continue-on-error: true
        uses: ./.github/actions/composer-audit
        with:
          working_directory: nolockfix

      # Several directories: one summary, totals across them, and a missing
      # directory fails the step only after the others have reported.
      - name: Run composer-audit (multiple directories)
        id: multi
        uses: ./.github/actions/composer-audit
        with:
          working_directory: |
            auditfix

            cleanfix/

      - name: Run composer-audit (multiple, one missing)
        id: multimissing
        continue-on-error: true
        uses: ./.github/actions/composer-audit
        with:
          working_directory: |
            auditfix
            nolockfix

      - name: Assert audit results
        env:
          PROD_PACKAGES: ${{ steps.prod.outputs.package_count }}
          PROD_ADVISORIES: ${{ steps.prod.outputs.advisory_count }}
          DEV_PACKAGES: ${{ steps.dev.outputs.package_count }}
          CLEAN_ADVISORIES: ${{ steps.clean.outputs.advisory_count }}
          NOLOCK_OUTCOME: ${{ steps.nolock.outcome }}
          MULTI_PACKAGES: ${{ steps.multi.outputs.package_count }}
          MULTI_OUTCOME: ${{ steps.multi.outcome }}
          MISSING_PACKAGES: ${{ steps.multimissing.outputs.package_count }}
          MISSING_OUTCOME: ${{ steps.multimissing.outcome }}
        run: |
          fail=0
          [ "$PROD_PACKAGES" = "1" ]   || { echo "::error::expected 1 production package, got '$PROD_PACKAGES'"; fail=1; }
          [ "${PROD_ADVISORIES:-0}" -ge 1 ] || { echo "::error::expected advisories for symfony/http-kernel 4.4.0, got '$PROD_ADVISORIES'"; fail=1; }
          [ "$DEV_PACKAGES" = "2" ]    || { echo "::error::the default should include phpunit, got '$DEV_PACKAGES' packages"; fail=1; }
          [ "$CLEAN_ADVISORIES" = "0" ] || { echo "::error::clean fixture reported '$CLEAN_ADVISORIES' advisories"; fail=1; }
          [ "$NOLOCK_OUTCOME" = "failure" ] || { echo "::error::a missing composer.lock should fail, got '$NOLOCK_OUTCOME'"; fail=1; }
          [ "$MULTI_OUTCOME" = "success" ]  || { echo "::error::two valid directories should pass, got '$MULTI_OUTCOME'"; fail=1; }
          [ "$MULTI_PACKAGES" = "2" ]       || { echo "::error::expected 2 packages across auditfix + cleanfix (dev included by default), got '$MULTI_PACKAGES'"; fail=1; }
          [ "$MISSING_OUTCOME" = "failure" ] || { echo "::error::a listed directory with no lock should fail, got '$MISSING_OUTCOME'"; fail=1; }
          [ "$MISSING_PACKAGES" = "2" ]     || { echo "::error::auditfix should still report alongside a missing directory, got '$MISSING_PACKAGES'"; fail=1; }
          exit "$fail"

      # The Fixed-in logic against synthetic ranges, offline, so every shape
      # seen in real reports is pinned regardless of what advisories exist.
      - name: Assert Fixed in and summary formatting
        run: |
          dir=$(mktemp -d)
          cat > "$dir/composer.lock" <<'EOF'
          {"packages":[
            {"name":"a/drupal","version":"3.3.9"},
            {"name":"a/chain","version":"v7.3.2"},
            {"name":"a/lte","version":"2.10.1"},
            {"name":"a/nofix","version":"1.2.0"},
            {"name":"a/caret","version":"1.2.0"},
            {"name":"a/multi","version":"3.1.0"}
          ]}
          EOF
          cat > "$dir/audit.json" <<'EOF'
          Deprecated: PHP Startup: noise printed before the report
          {"advisories":{
            "a/drupal":[{"advisoryId":"SA-CONTRIB-2026-1","affectedVersions":"<2.41 || >=3.0.0 <3.3.13","title":"Mod - Critical - Access bypass - SA-CONTRIB-2026-1","link":"https://example.com/sa"}],
            "a/chain":[{"advisoryId":"X1","affectedVersions":">=7.3.0,<7.4.0|>=7.4.0,<7.4.22","title":"t"}],
            "a/lte":[{"advisoryId":"X2","affectedVersions":">=2.0.0,<=2.10.1","title":"A | B"}],
            "a/nofix":[{"advisoryId":"X3","affectedVersions":">=1.0","title":"t"}],
            "a/caret":[{"advisoryId":"X4","affectedVersions":"^1.0","title":"t"}],
            "a/multi":{"0":{"advisoryId":"X5","affectedVersions":">=3.0.0 <3.1.4","title":"t"},"2":{"advisoryId":"X6","affectedVersions":">=3.0.0 <3.2.1","title":"t"}}
          },"abandoned":[],"filter":[]}
          EOF
          script=.github/actions/composer-audit/summarize.php
          fail=0

          GITHUB_STEP_SUMMARY="$dir/sum.md" GITHUB_OUTPUT="$dir/out" php "$script" "$dir" "$dir/audit.json" 1
          cat "$dir/sum.md"
          expect() { grep -qF -- "$1" "$dir/sum.md" || { echo "::error::summary is missing: $1"; fail=1; }; }
          expect '| a/drupal | 3.3.9 | 3.3.13 | [SA-CONTRIB-2026-1](https://example.com/sa): Mod - Critical - Access bypass |'
          expect '| a/chain | 7.3.2 | 7.4.22 |'
          expect '| a/lte | 2.10.1 | after 2.10.1 | X2: A \| B |'
          expect '| a/nofix | 1.2.0 | No fix released |'
          # shellcheck disable=SC2016 # literal backticks: a markdown code span
          expect '| a/caret | 1.2.0 | Check advisory: `^1.0` |'
          expect '| a/multi | 3.1.0 | 3.2.1 | X5: t<br>X6: t |'
          grep -qxF 'advisory_count=7' "$dir/out" || { echo "::error::expected advisory_count=7"; fail=1; }
          grep -qxF 'package_count=6' "$dir/out"  || { echo "::error::expected package_count=6"; fail=1; }

          echo 'not json' > "$dir/bad.json"
          if GITHUB_STEP_SUMMARY="$dir/bad.md" php "$script" "$dir" "$dir/bad.json" 1; then
            echo "::error::an unusable report should fail"; fail=1
          fi
          grep -qF 'Audit failed' "$dir/bad.md" || { echo "::error::failure summary missing"; fail=1; }

          # Multiple locations: a heading each, totals up top, and a failed
          # location reported in place while the step still fails.
          cd "$dir"
          echo '{"advisories":[],"abandoned":[]}' > clean.json
          if GITHUB_STEP_SUMMARY=multi.md GITHUB_OUTPUT=multi.out php "$OLDPWD/$script" . audit.json 1 theme/ clean.json 0 gone bad.json missing; then
            echo "::error::a missing location should fail the multi-location run"; fail=1
          fi
          cat multi.md
          cd "$OLDPWD"
          multi() { grep -qF -- "$1" "$dir/multi.md" || { echo "::error::multi summary is missing: $1"; fail=1; }; }
          multi '6 packages, 7 advisories across 3 locations'
          # shellcheck disable=SC2016 # literal backticks: markdown code spans
          multi '#### `.`'
          # shellcheck disable=SC2016
          multi '#### `theme`'
          # shellcheck disable=SC2016
          multi '#### `gone`'
          multi '| a/chain | 7.3.2 | 7.4.22 |'
          multi 'No security advisories.'
          # shellcheck disable=SC2016
          multi '**Audit failed** - No `composer.lock` in this directory.'
          grep -qxF 'package_count=6' "$dir/multi.out" || { echo "::error::multi package_count should total 6"; fail=1; }
          exit "$fail"

  composer-diff:
    name: Composer diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runner
        with:
          php_version: '8.3'

      # Two local commits stand in for a PR: the first is the base, the second
      # changes the root lock, adds a lock, and leaves the theme lock alone.
      - name: Build fixture commits
        id: fixture
        run: |
          git config user.name ci
          git config user.email ci@example.com
          lock() { printf '{"packages":[%s],"packages-dev":[]}\n' "$1"; }
          pkg() { printf '{"name":"%s","version":"%s","type":"library"}' "$1" "$2"; }
          mkdir -p diffix/theme
          echo '{"require":{"acme/direct":"*"}}' > diffix/composer.json
          lock "$(pkg acme/direct 1.0.0),$(pkg acme/transitive 2.0.0)" > diffix/composer.lock
          echo '{"require":{"acme/theme-lib":"*"}}' > diffix/theme/composer.json
          lock "$(pkg acme/theme-lib 3.0.0)" > diffix/theme/composer.lock
          git add diffix
          git commit -qm "fixture base"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          lock "$(pkg acme/direct 1.1.0),$(pkg acme/transitive 2.0.1),$(pkg acme/new 0.1.0)" > diffix/composer.lock
          mkdir -p diffix/added
          echo '{}' > diffix/added/composer.json
          lock "$(pkg acme/fresh 1.0.0)" > diffix/added/composer.lock
          git add diffix
          git commit -qm "fixture change"

      - name: Run composer-diff (several directories)
        id: multi
        uses: ./.github/actions/composer-diff
        with:
          base: ${{ steps.fixture.outputs.base }}
          working_directory: |
            diffix
            diffix/theme/
            diffix/added
          dry_run: 'true'

      - name: Assert the multi-directory comment
        env:
          CHANGED: ${{ steps.multi.outputs.changed }}
          FILE: ${{ steps.multi.outputs.comment_file }}
          URL: ${{ steps.multi.outputs.comment_url }}
        run: |
          cat "$FILE"
          fail=0
          [ "$CHANGED" = "true" ] || { echo "::error::expected changed=true, got '$CHANGED'"; fail=1; }
          [ -z "$URL" ]           || { echo "::error::dry_run still posted: $URL"; fail=1; }
          head -n 1 "$FILE" | grep -qxF '<!-- composer-diff -->' || { echo "::error::comment must start with the marker"; fail=1; }
          expect() { grep -qF -- "$1" "$FILE" || { echo "::error::comment is missing: $1"; fail=1; }; }
          # shellcheck disable=SC2016 # literal backticks: markdown code spans
          expect '#### `diffix/composer.lock`'
          # shellcheck disable=SC2016
          expect '#### `diffix/theme/composer.lock`'
          # shellcheck disable=SC2016
          expect '#### `diffix/added/composer.lock`'
          expect '| acme/direct     | Upgraded  | 1.0.0 | 1.1.0  |'
          expect '| acme/new        | New       | -     | 0.1.0  |'
          expect '| acme/fresh    | New       | -    | 1.0.0  |'
          # The unchanged theme lock collapses to one line.
          awk '/diffix\/theme\/composer.lock/{getline; getline; print; exit}' "$FILE" | grep -qxF '✅ No changes.' \
            || { echo "::error::unchanged lock should read '✅ No changes.'"; fail=1; }
          exit "$fail"

      - name: Run composer-diff (unchanged only)
        id: unchanged
        uses: ./.github/actions/composer-diff
        with:
          base: ${{ steps.fixture.outputs.base }}
          working_directory: diffix/theme
          dry_run: 'true'

      - name: Run composer-diff (missing directory)
        id: missing
        continue-on-error: true
        uses: ./.github/actions/composer-diff
        with:
          base: ${{ steps.fixture.outputs.base }}
          working_directory: diffix/nope
          dry_run: 'true'

      - name: Run composer-diff (base not in checkout)
        id: nobase
        continue-on-error: true
        uses: ./.github/actions/composer-diff
        with:
          base: 0000000000000000000000000000000000000000
          working_directory: diffix
          dry_run: 'true'

      - name: Assert the other paths
        env:
          UNCHANGED: ${{ steps.unchanged.outputs.changed }}
          UNCHANGED_FILE: ${{ steps.unchanged.outputs.comment_file }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          NOBASE_OUTCOME: ${{ steps.nobase.outcome }}
        run: |
          fail=0
          [ "$UNCHANGED" = "false" ] || { echo "::error::an unchanged lock should give changed=false, got '$UNCHANGED'"; fail=1; }
          # shellcheck disable=SC2016
          grep -qxF '`diffix/theme/composer.lock`' "$UNCHANGED_FILE" || { echo "::error::single-lock comment should name the lock"; fail=1; }
          [ "$(grep -cxF '✅ No changes.' "$UNCHANGED_FILE")" = "2" ] || { echo "::error::single unchanged lock should show No changes under both headings"; fail=1; }
          [ "$MISSING_OUTCOME" = "failure" ] || { echo "::error::a directory with no lock on either side should fail, got '$MISSING_OUTCOME'"; fail=1; }
          [ "$NOBASE_OUTCOME" = "failure" ]  || { echo "::error::a base missing from the checkout should fail, got '$NOBASE_OUTCOME'"; fail=1; }
          exit "$fail"
